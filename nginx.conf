events {}

http {
    # Referers allowed to embed the photographs. An empty or absent referer
    # (direct navigation, link previews, feed readers) is deliberately allowed;
    # this only stops other sites hotlinking the files into their own pages.
    map $http_referer $photo_hotlink {
        default                                 1;
        ""                                      0;
        "~*^https?://(www\.)?meshkov\.page/"    0;
        "~*^https?://localhost"                 0;
    }

    server {
        # Cloud Run listens on port 8080 by default
        listen 8080;
        server_name www.meshkov.page;

        # ------------------------------------------------------------------
        # Photographs, proxied through this domain rather than linked straight
        # at the bucket. Serving them from meshkov.page is what makes
        # robots.txt, X-Robots-Tag and hotlink rules apply to the image files.
        # ------------------------------------------------------------------
        location /photos/ {
            if ($photo_hotlink) {
                return 403;
            }

            rewrite ^/photos/(.*)$ /zoomio-public/meshkov-page/$1 break;

            proxy_pass https://storage.googleapis.com;
            proxy_set_header Host storage.googleapis.com;
            proxy_ssl_server_name on;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Replace the bucket's own caching and add the machine-readable
            # reservation to every image response.
            proxy_hide_header Cache-Control;
            proxy_hide_header x-goog-meta-goog-reserved-file-mtime;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Robots-Tag "noai, noimageai" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location / {
            # Handle root -> index.html
            rewrite ^/$ /www.meshkov.page/index.html break;

            # Handle directory requests ending in / -> /.../index.html
            rewrite ^/(.*/)$ /www.meshkov.page/$1index.html break;

            # Handle everything else -> /bucket/path
            rewrite ^/(.*)$ /www.meshkov.page/$1 break;

            # Proxy to GCS root with the rewritten path
            proxy_pass https://storage.googleapis.com;

            # Necessary headers for GCS
            proxy_set_header Host storage.googleapis.com;
            proxy_ssl_server_name on;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Content-Type-Options "nosniff" always;

            # Intercept errors from GCS (like 404 for SPA routes)
            proxy_intercept_errors on;
            error_page 404 = @fallback;
        }

        location @fallback {
            # Provide index.html for any 404 (SPA default)
            rewrite ^ /www.meshkov.page/index.html break;
            proxy_pass https://storage.googleapis.com;

            proxy_set_header Host storage.googleapis.com;
            proxy_ssl_server_name on;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
