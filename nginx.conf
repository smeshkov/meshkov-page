events {}

http {
    server {
        # Cloud Run listens on port 8080 by default
        listen 8080;
        server_name www.meshkov.page;

        location / {
            # Proxy to the GCS bucket
            # Handle root -> index.html
            rewrite ^/$ /www.meshkov.page/index.html break;
            
            # Handle everything else -> /bucket/path
            rewrite ^/(.*)$ /www.meshkov.page/$1 break;

            # Proxy to GCS root with the rewritten path
            proxy_pass https://storage.googleapis.com;
            
            # Necessary headers for GCS
            proxy_set_header Host storage.googleapis.com;
            proxy_ssl_server_name on;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Intercept errors from GCS (like 404 for SPA routes)
            proxy_intercept_errors on;
            error_page 404 = @fallback;
        }

        location @fallback {
            # Provide index.html for any 404 (SPA default)
            rewrite ^ /www.meshkov.page/index.html break;
            proxy_pass https://storage.googleapis.com;
            
            proxy_set_header Host storage.googleapis.com;
            proxy_ssl_server_name on;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
