{{ define "main" }}
<div class="page">
  <div class="page__head">
    <div class="page__headtext">
      <span class="eyebrow">Journal &middot; topic</span>
      <h1 class="display-l">{{ .Title }}</h1>
    </div>
    <div class="page__filters">
      <a href="{{ (site.GetPage "/blog").RelPermalink }}">All entries</a>
    </div>
  </div>

  <div class="journal">
    {{ partial "journal-items.html" .Pages.ByDate.Reverse }}
    <aside class="journal__side">{{ partial "letter.html" . }}</aside>
  </div>
</div>
{{ end }}
