{{ define "main" }}
{{ .Content }}
<div class="horizontal-gallery-container">
  <div class="horizontal-gallery" id="horizontal-gallery">
    {{ range $category, $photos := .Site.Data.photos }}
      {{ range $photos }}
      <div class="gallery-item">
        <img
          src="{{ .src }}"
          alt="{{ .title }}"
          class="img-fluid"
          crossorigin="anonymous"
          loading="lazy"
        />
      </div>
      {{ end }}
    {{ end }}
  </div>
</div>
{{ end }}
