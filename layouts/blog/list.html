{{ define "main" }}
<div class="page">
  <div class="page__head">
    <div class="page__headtext">
      <span class="eyebrow">Journal</span>
      <h1 class="display-l">{{ .Params.headline | default "Notes on seeing" }}</h1>
    </div>
  </div>

  <div class="journal">
    {{ partial "journal-items.html" .Pages.ByDate.Reverse }}

    <aside class="journal__side">
      {{ partial "letter.html" . }}
      {{- with site.GetPage "/tags" }}
      {{- with .Pages }}
      <div class="topics">
        <h2 class="topics__head">Topics</h2>
        <div class="topics__list">
          {{- range . }}
          <a href="{{ .RelPermalink }}">{{ .Title }}</a>
          {{- end }}
        </div>
      </div>
      {{- end }}
      {{- end }}
    </aside>
  </div>
</div>
{{ end }}
